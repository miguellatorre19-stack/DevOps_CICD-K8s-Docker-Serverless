name: Frontend CI/CD to EKS

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - "manifests/02-temperature-web.yaml"
      - ".github/workflows/frontend-cicd.yml"
  pull_request:
    branches: [ "main" ]
      - "frontend/**"
      - "manifests/02-temperature-web.yaml"
      - ".github/workflows/frontend-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: temperature_k8s
  DOCKERHUB_IMAGE: miguellatorre/temperaturas-frontend
  K8S_MANIFEST: manifests/02-temperature-web.yaml

jobs:
  build-push-deploy:
    name: Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: miguellatorre/temperaturas-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Compute immutable image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        if: github.event_name != 'pull_request'
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
        
      - name: Deploy frontend to EKS
          run: |
          kubectl set image deployment/temperaturas-frontend \
            temperaturas-frontend=${DOCKERHUB_IMAGE}:${IMAGE_TAG} -n default
          kubectl rollout status deployment/temperaturas-frontend -n default
