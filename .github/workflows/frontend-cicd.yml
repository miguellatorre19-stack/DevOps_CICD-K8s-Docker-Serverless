name: Frontend CI/CD to EKS

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - "k8s/frontend.yaml"
      - ".github/workflows/frontend-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: TU_CLUSTER_EKS
  K8S_NAMESPACE: default
  DOCKERHUB_IMAGE: TUUSUARIO_DOCKERHUB/temperaturas-frontend
  K8S_MANIFEST: k8s/frontend.yaml

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: 
          aws-secret-access-key:
          aws-session-token:
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Replace image in manifest
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${DOCKERHUB_IMAGE}:${GITHUB_SHA}|g" "$K8S_MANIFEST"

      - name: Deploy frontend to EKS
        run: |
          kubectl apply -n "$K8S_NAMESPACE" -f "$K8S_MANIFEST"
          kubectl rollout status deployment/temperaturas-frontend -n "$K8S_NAMESPACE"
