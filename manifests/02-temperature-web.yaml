apiVersion: v2
kind: Service
metadata: 
  name: temperaturas-frontend
spec: 
   ports:
    - port: 3001
      targetPort: 3001
   selector: 
     app: temperaturas-backend
   type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperaturas-frontend
spec:
  replicas: 1
  selector: 
    matchLabels: 
      app: temperaturas-frontend
  template: 
    metadata: 
      labels:
        app: temperaturas-frontend
    spec: 
      containers: 
      - name:  temperaturas-frontend
      image: 
      ports: 
        - containerPort: 3001
      resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"     
      
  
